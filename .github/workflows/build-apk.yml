name: Build Nexus Speak Native APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js & Build Web Assets
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Web App
        run: |
          npm ci || npm install
          npm run build
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Build Android APK
        run: |
          cd android
          gradle wrapper
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../NexusSpeak-Floating-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusSpeak-Floating-Native-APK
          path: NexusSpeak-Floating-v1.0.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-native
          name: "Nexus Speak v1.0.0 Native (With Display Over Other Apps)"
          body: |
            ### Nexus Speak Native Android Release
            - ✅ **Display Over Other Apps (WhatsApp Floating Voice Bubble)** included!
            - ✅ **Microphone (RECORD_AUDIO)** permission included!
            - ✅ Native Speech Recognition and Translation Assistant.
          files: NexusSpeak-Floating-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

